services:
  kalm: &kalm-base
    build:
      # Build context: the directory sent to the Docker daemon for the build.
      # Files under this path are available to the Dockerfile (e.g., via COPY/ADD).
      # Using `.` sends the repository root so the Dockerfile can access repo files.
      context: .
      dockerfile: Dockerfile
    image: kalm-env:local
    volumes:
      # Mount repo at /workspace
      - .:/workspace
    working_dir: /workspace
    environment:
      # Use a locale that is commonly available in base images
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    init: true
    # Interactive terminal for pwsh
    tty: true
    stdin_open: true

  gradle-shell:
    &gradle-shell-base
    <<: *kalm-base
    profiles:
      - gradle
    volumes: &gradle-overlay-volumes
      - .:/workspace
      - gradle-cache:/gradle-cache
      - gradle-root-dot-gradle:/workspace/.gradle
      - gradle-root-dot-kotlin:/workspace/.kotlin
      - gradle-root-build:/workspace/build
      - gradle-core-build:/workspace/core/build
      - gradle-platform-build:/workspace/platform/build
      - gradle-tools-build:/workspace/tools/build
      - gradle-build-logic-dot-gradle:/workspace/build-logic/.gradle
      - gradle-build-logic-dot-kotlin:/workspace/build-logic/.kotlin
      - gradle-build-logic-build:/workspace/build-logic/build
    environment:
      GRADLE_USER_HOME: /gradle-cache

  # Convenience service for running gradle tasks
  gradle:
    <<: *gradle-shell-base
    # Run Gradle by default; runtime args are appended to this entrypoint.
    entrypoint: ["./gradlew"]
    # Users pass gradle tasks like: docker compose --profile gradle run --rm gradle verifyAll

  hadolint-kts:
    <<: *kalm-base
    build:
      context: .
      dockerfile: scripts/docker/Dockerfile.hadolint-kts
    image: kalm-hadolint-kts:local
    profiles:
      - hadolint
    entrypoint: ["kotlin", "-classpath", "/opt/hadolint-cli.jar", "cl.ravenhill.kalm.tools.hadolint.HadolintCli"]
    # Pass CLI args at runtime, e.g.:
    # `docker compose --profile hadolint run --rm hadolint-kts --failure-threshold error --dockerfile Dockerfile`

volumes:
  gradle-cache: {}
  gradle-root-dot-gradle: {}
  gradle-root-dot-kotlin: {}
  gradle-root-build: {}
  gradle-core-build: {}
  gradle-platform-build: {}
  gradle-tools-build: {}
  gradle-build-logic-dot-gradle: {}
  gradle-build-logic-dot-kotlin: {}
  gradle-build-logic-build: {}
